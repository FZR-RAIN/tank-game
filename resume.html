<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>黄漫雪 · 个人简历</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
.card{background:#fff;border-radius:16px;padding:40px 32px;text-align:center;
  max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card .avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 16px;
  background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;
  justify-content:center;font-size:36px;color:#fff;font-weight:bold}
.card h1{font-size:22px;color:#333;margin-bottom:4px}
.card .sub{font-size:13px;color:#999;margin-bottom:24px}
.card .btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;
  text-decoration:none;font-weight:500;cursor:pointer;transition:transform .2s}
.card .btn:active{transform:scale(.97)}
.card .tip{margin-top:16px;font-size:12px;color:#bbb}
.loader{width:24px;height:24px;border:3px solid #eee;border-top-color:#764ba2;
  border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="avatar">黄</div>
  <h1>黄漫雪 · THE SEEKER</h1>
  <p class="sub">现代水产养殖技术 · AI 应用探索者</p>
  <div id="status">
    <div class="loader"></div>
    <p style="font-size:13px;color:#999">正在打开简历...</p>
  </div>
  <a id="btn" class="btn" href="https://5ab03f7af9334fe6b59f68ca76f9cfb3.app.workbuddy.link" style="display:none">进入简历 ✦</a>
  <p class="tip">手机电脑均可打开 · 微信QQ直接点击</p>
</div>
<script>
// 自动跳转 + 微信/QQ兼容处理
var TARGET='https://5ab03f7af9334fe6b59f68ca76f9cfb3.app.workbuddy.link';
var ua=navigator.userAgent.toLowerCase();
var inWechat=ua.indexOf('micromessenger')>-1;
var inQQ=ua.indexOf('qq/')>-1||ua.indexOf('qqbrowser')>-1;

if(inWechat){
  // 微信内置浏览器直接跳转
  setTimeout(function(){location.href=TARGET},800);
}else{
  // 其他浏览器自动跳转，3秒后显示手动按钮
  location.href=TARGET;
  setTimeout(function(){
    document.getElementById('status').style.display='none';
    document.getElementById('btn').style.display='block';
  },3000);
}
</script>
</body>
</html>
