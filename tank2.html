<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>经典坦克大战 · HMX 丛林</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; }
  /* ---------- 触屏按钮 ---------- */
  #touchui { display:none; }
  .tbtn {
    position:fixed; z-index:10; user-select:none; -webkit-user-select:none;
    background:rgba(255,255,255,0.10); border:2px solid rgba(255,255,255,0.35);
    color:rgba(255,255,255,0.85); font:bold 20px monospace; text-align:center;
    touch-action:none; -webkit-tap-highlight-color:transparent; border-radius:10px;
  }
  .tbtn.on { background:rgba(255,255,255,0.35); }
  #d-up    { left:70px;  bottom:150px; width:58px; height:58px; line-height:58px; border-radius:12px; }
  #d-down  { left:70px;  bottom:26px;  width:58px; height:58px; line-height:58px; border-radius:12px; }
  #d-left  { left:12px;  bottom:88px;  width:58px; height:58px; line-height:58px; border-radius:12px; }
  #d-right { left:128px; bottom:88px;  width:58px; height:58px; line-height:58px; border-radius:12px; }
  #fire    { right:28px; bottom:56px;  width:92px; height:92px; line-height:92px; border-radius:50%;
             font-size:16px; border-color:rgba(255,120,80,0.7); background:rgba(255,90,50,0.18); color:#ffb0a0; }
  #fire.on { background:rgba(255,120,60,0.55); }
  #pauseb  { right:16px; top:14px; width:48px; height:40px; line-height:38px; font-size:16px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touchui">
  <div class="tbtn" id="d-up">&#9650;</div>
  <div class="tbtn" id="d-left">&#9664;</div>
  <div class="tbtn" id="d-right">&#9654;</div>
  <div class="tbtn" id="d-down">&#9660;</div>
  <div class="tbtn" id="fire">FIRE</div>
  <div class="tbtn" id="pauseb">II</div>
</div>
<script>
'use strict';
/* ================================================================
   经典坦克大战 · HMX 丛林版
   仿 FC《Battle City》：黑底砖墙 + 老鹰基地 + 右侧记分板
   草丛按 H / M / X 字样排列；砖墙钢块布局为本作自设
   ================================================================ */

/* ---------------- 常量 ---------------- */
const CELL = 16, COLS = 26, ROWS = 26;
const PLAY_W = COLS * CELL, PLAY_H = ROWS * CELL;   // 416 x 416
const SIDE = 96, VIEW_W = PLAY_W + SIDE, VIEW_H = PLAY_H; // 512 x 416
const T_EMPTY = 0, T_BRICK = 1, T_STEEL = 2, T_GRASS = 3, T_BASE = 4;
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const DIR_ANGLE = { up:0, right:Math.PI/2, down:Math.PI, left:-Math.PI/2 };
const ENEMY_VAL = { basic:100, fast:200, power:300, armor:400 };
const ENEMY_NAME = { basic:'基本坦克', fast:'快速坦克', power:'重炮坦克', armor:'装甲坦克' };

/* ---------------- 地图数据 ----------------
   砖墙竖列仿参考图；三片草丛拼成 H M X；中央与两侧有钢块 */
const BRICKS = [
  [2,2,2,5],[6,3,2,5],[10,2,2,4],[14,2,2,6],[18,3,2,5],[22,2,2,5],
  [7,11,2,3],[9,13,8,1],[17,11,2,3],
  [2,16,2,5],[6,18,2,3],[19,18,2,3],
  [2,22,2,2],[22,22,2,2]
];
const STEELS = [ [12,8,2,2],[0,11,1,2],[25,11,1,2] ];
const RING = [ [11,23,4,1],[11,24,1,2],[14,24,1,2] ];   // 基地护墙
const EAGLE = { c:12, r:24 };                            // 老鹰 2x2 格
const GRASS_LETTERS = [
  { x:2,  y:9, rows:['10001','10001','11111','10001','10001'] },  // H
  { x:10, y:16,rows:['10001','11011','10101','10001','10001'] },  // M
  { x:19, y:9, rows:['10001','01010','00100','01010','10001'] }   // X
];
const PLAYER_SPAWN = { x:8*CELL, y:24*CELL };
const ENEMY_SPAWNS = [ {x:0,y:0}, {x:12*CELL,y:0}, {x:24*CELL,y:0} ];

/* ---------------- 工具 ---------------- */
function rnd(a,b){ return a + Math.random()*(b-a); }
function irnd(a,b){ return Math.floor(rnd(a,b+1)); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
function overlap(ax,ay,aw,ah,bx,by,bw,bh){ return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ---------------- 音效（WebAudio 芯片音） ---------------- */
const Sfx = {
  ctx:null,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  beep(f0,f1,dur,type,vol){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type||'square';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(vol||0.12,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol,fc){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate*dur);
    const buf = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = fc||900;
    const g = this.ctx.createGain(); g.gain.value = vol||0.2;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t);
  },
  fire(){ this.beep(900,240,0.07,'square',0.08); },
  brick(){ this.noise(0.06,0.16,1400); },
  clank(){ this.beep(1600,1500,0.03,'square',0.06); },
  boom(){ this.noise(0.3,0.3,700); this.beep(160,40,0.25,'triangle',0.15); },
  boomBig(){ this.noise(0.6,0.4,500); this.beep(120,30,0.5,'triangle',0.2); },
  pick(){ this.beep(660,660,0.07,'square',0.1); setTimeout(()=>this.beep(880,880,0.07,'square',0.1),70); setTimeout(()=>this.beep(1320,1320,0.1,'square',0.1),140); },
  life(){ this.beep(523,523,0.09,'square',0.1); setTimeout(()=>this.beep(784,784,0.12,'square',0.1),100); },
  pause(){ this.beep(880,880,0.05,'square',0.1); setTimeout(()=>this.beep(660,660,0.05,'square',0.1),80); },
  stage(){ const seq=[392,523,659,784]; seq.forEach((f,i)=>setTimeout(()=>this.beep(f,f,0.12,'square',0.1), i*110)); },
  over(){ const seq=[392,330,262,196]; seq.forEach((f,i)=>setTimeout(()=>this.beep(f,f,0.22,'triangle',0.14), i*220)); }
};

/* ---------------- 输入 ---------------- */
const input = { up:false, down:false, left:false, right:false, fire:false };
const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  Space:'fire', KeyJ:'fire', KeyK:'fire'
};
addEventListener('keydown', e=>{
  Sfx.init();
  if(KEYMAP[e.code]){ input[KEYMAP[e.code]] = true; e.preventDefault(); }
  if(e.code==='Enter') onConfirm();
  if(e.code==='KeyP' || e.code==='Escape') togglePause();
});
addEventListener('keyup', e=>{ if(KEYMAP[e.code]){ input[KEYMAP[e.code]] = false; e.preventDefault(); } });

// 触屏按钮
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
if(IS_TOUCH){
  document.getElementById('touchui').style.display = 'block';
  const bind = (id,key)=>{
    const el = document.getElementById(id);
    const on = e=>{ e.preventDefault(); Sfx.init(); input[key]=true; el.classList.add('on'); };
    const off = e=>{ e.preventDefault(); input[key]=false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  };
  bind('d-up','up'); bind('d-down','down'); bind('d-left','left'); bind('d-right','right'); bind('fire','fire');
  document.getElementById('pauseb').addEventListener('pointerdown', e=>{ e.preventDefault(); Sfx.init(); togglePause(); });
}
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && G.state==='play' && !G.paused) togglePause(); });

/* ---------------- 画布（先声明，避免引用顺序问题） ---------------- */
const canvas = document.getElementById('game');
const CTX = canvas.getContext('2d');

/* ---------------- 全局状态 ---------------- */
const G = {
  state:'menu',        // menu | intro | play | tally | over
  paused:false,
  stage:1, score:0, best:+(localStorage.getItem('tank2_best')||0),
  lives:3,
  terrain:new Uint8Array(COLS*ROWS),
  bmask:new Uint8Array(COLS*ROWS),
  player:null, enemies:[], bullets:[], flashes:[], explosions:[], popups:[], powerups:[],
  queue:[], spawnT:0, spawnIdx:0, maxOn:4,
  freeze:0, baseRingT:0,
  kills:null, stageScore:0,
  introT:0, overT:0, clearT:0, tallyT:0,
  eagleAlive:true, time:0
};
const idx = (c,r)=> r*COLS + c;
const inMap = (c,r)=> c>=0 && c<COLS && r>=0 && r<ROWS;

function setRect(t,x,y,w,h){
  for(let r=y;r<y+h;r++) for(let c=x;c<x+w;c++){
    if(!inMap(c,r)) continue;
    G.terrain[idx(c,r)] = t;
    G.bmask[idx(c,r)] = (t===T_BRICK) ? 0b1111 : 0;
  }
}
function setBaseRing(t){ RING.forEach(rg=>setRect(t, rg[0],rg[1],rg[2],rg[3])); }

function buildTerrain(){
  G.terrain.fill(T_EMPTY); G.bmask.fill(0);
  BRICKS.forEach(b=>setRect(T_BRICK, b[0],b[1],b[2],b[3]));
  STEELS.forEach(s=>setRect(T_STEEL, s[0],s[1],s[2],s[3]));
  // 草丛 HMX（只写入空地，保证字形完整）
  GRASS_LETTERS.forEach(L=>{
    for(let r=0;r<L.rows.length;r++){
      const row = L.rows[r];
      for(let c=0;c<row.length;c++){
        if(row[c]==='1'){
          const cc=L.x+c, rr=L.y+r;
          if(inMap(cc,rr) && G.terrain[idx(cc,rr)]===T_EMPTY) G.terrain[idx(cc,rr)] = T_GRASS;
        }
      }
    }
  });
  setBaseRing(T_BRICK);
  // 老鹰格
  for(let r=0;r<2;r++) for(let c=0;c<2;c++) G.terrain[idx(EAGLE.c+c, EAGLE.r+r)] = T_BASE;
}

/* ---------------- 关卡队列 ---------------- */
function buildQueue(n){
  const armor = Math.min(2+n, 8), power = Math.min(1+Math.ceil(n/2), 6), fast = Math.min(4+n, 9);
  let basic = 20 - armor - power - fast; if(basic < 2) basic = 2;
  const arr = [];
  for(let i=0;i<basic;i++) arr.push('basic');
  for(let i=0;i<fast;i++)  arr.push('fast');
  for(let i=0;i<power;i++) arr.push('power');
  for(let i=0;i<armor;i++) arr.push('armor');
  shuffle(arr);
  return arr.map((t,i)=>({ type:t, bonus:(i===3||i===10||i===17) }));
}

/* ---------------- 坦克 ---------------- */
const PAL_PLAYER = { body:'#e8c53a', dark:'#8a6d10', tread:'#4a4a4a', treadLight:'#9a9a9a' };
const PAL_ENEMY = {
  basic:{ body:'#c8c8c8', dark:'#5a5a5a', tread:'#3a3a3a', treadLight:'#8a8a8a' },
  fast: { body:'#a8d8e8', dark:'#4a7a8a', tread:'#3a3a3a', treadLight:'#8ab8c8' },
  power:{ body:'#e8d890', dark:'#8a7a30', tread:'#3a3a3a', treadLight:'#b8a860' },
  armor:[
    { body:'#e8e8e8', dark:'#6a6a6a', tread:'#3a3a3a', treadLight:'#a8a8a8' },
    { body:'#e8d048', dark:'#8a7410', tread:'#3a3a3a', treadLight:'#b8a860' },
    { body:'#98c838', dark:'#4a7a10', tread:'#3a3a3a', treadLight:'#b8d878' },
    { body:'#c8c8c8', dark:'#5a5a5a', tread:'#3a3a3a', treadLight:'#8a8a8a' }
  ]
};
const ENEMY_STAT = {
  basic:{ hp:1, speed:55, bSpeed:230 },
  fast: { hp:1, speed:95, bSpeed:230 },
  power:{ hp:1, speed:60, bSpeed:380 },
  armor:{ hp:4, speed:50, bSpeed:230 }
};

function makePlayer(){
  return {
    kind:'player', x:PLAYER_SPAWN.x, y:PLAYER_SPAWN.y, dir:'up',
    speed:75, weapon:G.stage===1?1:(G.player?G.player.weapon:1),
    shield:2.5, fireCD:0, tread:0, alive:true
  };
}
function makeEnemy(type, x, y, bonus){
  const st = ENEMY_STAT[type];
  const sc = 1 + Math.min(0.35,(G.stage-1)*0.06);
  return {
    kind:'enemy', type, bonus, x, y, dir:'down',
    hp:st.hp, speed:st.speed*sc, bSpeed:st.bSpeed,
    fireT:rnd(0.6,1.6), moveT:rnd(0.5,2), tread:0,
    flash:0, spawnGuard:0.1, alive:true
  };
}
function tankBox(t){ return { x:t.x+2, y:t.y+2, w:28, h:28 }; }

function solidAt(c,r){
  if(!inMap(c,r)) return true;
  const t = G.terrain[idx(c,r)];
  return t===T_BRICK || t===T_STEEL || t===T_BASE;
}
function areaFree(nx,ny,self){
  const bx=nx+2, by=ny+2, bw=28, bh=28;
  if(bx<0 || by<0 || bx+bw>PLAY_W || by+bh>PLAY_H) return false;
  const c0=Math.floor(bx/CELL), c1=Math.floor((bx+bw-0.01)/CELL);
  const r0=Math.floor(by/CELL), r1=Math.floor((by+bh-0.01)/CELL);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(solidAt(c,r)) return false;
  const all = G.player && G.player.alive && G.player!==self ? [G.player].concat(G.enemies) : G.enemies;
  for(const o of all){
    if(o===self || !o.alive) continue;
    const b = tankBox(o);
    if(overlap(bx,by,bw,bh, b.x,b.y,b.w,b.h)) return false;
  }
  return true;
}
function tryMove(t,dt){
  const d = DIRS[t.dir];
  const nx = t.x + d[0]*t.speed*dt, ny = t.y + d[1]*t.speed*dt;
  if(areaFree(nx,ny,t)){ t.x=nx; t.y=ny; t.tread += t.speed*dt; return true; }
  // 贴墙滑动：分轴尝试（横向撞墙时保留纵向位移）
  if(d[0]!==0){
    if(areaFree(nx,t.y,t)){ t.x=nx; return true; }
  } else {
    if(areaFree(t.x,ny,t)){ t.y=ny; return true; }
  }
  return false;
}
function setDir(t, dir){
  if(t.dir===dir) return;
  const wasV = (t.dir==='up'||t.dir==='down');
  const isV = (dir==='up'||dir==='down');
  t.dir = dir;
  // 转向时吸附半格，方便进 2 格宽通道；吸附后卡墙则回退
  if(wasV!==isV){
    const ox=t.x, oy=t.y;
    if(isV) t.x = Math.round(t.x/8)*8; else t.y = Math.round(t.y/8)*8;
    if(!areaFree(t.x,t.y,t)){ t.x=ox; t.y=oy; }
  }
}

/* ---------------- 子弹 ---------------- */
function ownerBullets(owner){ return G.bullets.filter(b=>b.owner===owner); }
function fireBullet(t){
  const isP = t.kind==='player';
  let maxB=1, speed=230, power=1;
  if(isP){
    maxB = t.weapon>=3 ? 2 : 1;
    speed = t.weapon>=2 ? 400 : 260;
    power = t.weapon>=3 ? 3 : (t.weapon>=2 ? 2 : 1);
    if(t.fireCD>0) return;
    t.fireCD = 0.18;
  } else {
    speed = t.bSpeed; maxB = 1;
  }
  if(ownerBullets(t).length >= maxB) return;
  const d = DIRS[t.dir];
  const bx = t.x+16 + d[0]*14 - 2, by = t.y+16 + d[1]*14 - 2;
  G.bullets.push({ x:bx, y:by, w:4, h:4, dir:t.dir, speed, power, owner:t, isP });
  Sfx.fire();
}

function damageCell(c,r,bx,by,bw,bh,power){
  const i = idx(c,r), t = G.terrain[i];
  if(t===T_BRICK){
    let m = G.bmask[i], hit = false;
    for(let q=0;q<4;q++){
      if(!(m&(1<<q))) continue;
      const qx = c*CELL + (q%2)*8, qy = r*CELL + (q>>1)*8;
      if(overlap(bx,by,bw,bh,qx,qy,8,8)){ m &= ~(1<<q); hit = true; }
    }
    G.bmask[i] = m;
    if(m===0) G.terrain[i] = T_EMPTY;
    if(hit) Sfx.brick();
    return hit;
  }
  if(t===T_STEEL){
    if(power>=3){ G.terrain[i]=T_EMPTY; Sfx.brick(); return true; }
    Sfx.clank(); return true;
  }
  if(t===T_BASE){ destroyEagle(); return true; }
  return false;
}

function updateBullets(dt){
  for(const b of G.bullets){
    if(b.dead) continue;
    let dist = b.speed*dt;
    while(dist>0 && !b.dead){
      const step = Math.min(4,dist); dist -= step;
      const d = DIRS[b.dir];
      b.x += d[0]*step; b.y += d[1]*step;
      // 边界
      if(b.x<0||b.y<0||b.x+4>PLAY_W||b.y+4>PLAY_H){
        b.dead=true; spark(clamp(b.x,0,PLAY_W-8), clamp(b.y,0,PLAY_H-8)); break;
      }
      // 地形（子弹 4x4 覆盖格）
      const c0=Math.floor(b.x/CELL), c1=Math.floor((b.x+3.99)/CELL);
      const r0=Math.floor(b.y/CELL), r1=Math.floor((b.y+3.99)/CELL);
      for(let r=r0;r<=r1 && !b.dead;r++) for(let c=c0;c<=c1 && !b.dead;c++){
        const t = G.terrain[idx(c,r)];
        if(t===T_BRICK||t===T_STEEL||t===T_BASE){
          if(damageCell(c,r,b.x,b.y,4,4,b.power)){ b.dead=true; spark(b.x-2,b.y-2); }
        }
      }
      if(b.dead) break;
      // 子弹对撞（玩家弹 vs 敌弹）
      for(const o of G.bullets){
        if(o===b || o.dead || o.isP===b.isP) continue;
        if(overlap(b.x,b.y,4,4,o.x,o.y,4,4)){ b.dead=true; o.dead=true; spark(b.x-2,b.y-2); break; }
      }
      if(b.dead) break;
      // 命中坦克
      if(b.isP){
        for(const e of G.enemies){
          if(!e.alive || e.spawnGuard>0) continue;
          const bx2=tankBox(e);
          if(overlap(b.x,b.y,4,4,bx2.x,bx2.y,bx2.w,bx2.h)){
            b.dead=true;
            e.hp--; e.flash=0.06;
            if(e.hp<=0) killEnemy(e);
            else { Sfx.clank(); spark(b.x-2,b.y-2); }
            break;
          }
        }
      } else {
        const p=G.player;
        if(p && p.alive){
          const px=tankBox(p);
          if(overlap(b.x,b.y,4,4,px.x,px.y,px.w,px.h)){
            b.dead=true;
            if(p.shield<=0) killPlayer();
            else spark(b.x-2,b.y-2);
          }
        }
      }
    }
  }
  G.bullets = G.bullets.filter(b=>!b.dead);
}

function spark(x,y){ G.explosions.push({x,y,t:0.12,big:false,tiny:true}); }
function boom(x,y,big){ G.explosions.push({x,y,t:big?0.5:0.28,big}); if(big) Sfx.boomBig(); else Sfx.boom(); }

function killEnemy(e){
  e.alive=false;
  boom(e.x,e.y,false);
  const val = ENEMY_VAL[e.type];
  G.score += val; G.stageScore += val;
  G.kills[e.type]++;
  G.popups.push({ x:e.x+16, y:e.y+8, val, t:0.9 });
  if(e.bonus) spawnPowerUp();
}
function killPlayer(){
  const p=G.player;
  p.alive=false;
  boom(p.x,p.y,true);
  G.lives--;
  if(G.lives<0){ startGameOver(); }
  else setTimeoutRespawn();
}
function setTimeoutRespawn(){ G.respawnT = 1.2; }
function destroyEagle(){
  if(!G.eagleAlive) return;
  G.eagleAlive=false;
  boom(EAGLE.c*CELL, EAGLE.r*CELL, true);
  startGameOver();
}
function startGameOver(){
  if(G.state==='over') return;
  G.state='over'; G.overT=0;
  Sfx.over();
  if(G.score>G.best){ G.best=G.score; localStorage.setItem('tank2_best', G.best); }
}

/* ---------------- 敌人生成 + AI ---------------- */
function spawnFlash(){
  // 优先选择未被坦克占住的出生点
  let pt = null;
  for(let i=0;i<3;i++){
    const cand = ENEMY_SPAWNS[(G.spawnIdx+i)%3];
    if(areaFree(cand.x,cand.y,null)){ pt = cand; G.spawnIdx = (G.spawnIdx+i+1)%3; break; }
  }
  if(!pt) pt = ENEMY_SPAWNS[G.spawnIdx++%3];
  const item = G.queue.shift();
  G.flashes.push({ x:pt.x, y:pt.y, t:1.0, item });
}
function updateSpawner(dt){
  if(G.queue.length + G.flashes.length === 0) return;
  const onField = G.enemies.length + G.flashes.length;
  if(onField < G.maxOn){
    G.spawnT -= dt;
    if(G.spawnT<=0){ G.spawnT = 2.2; if(G.queue.length) spawnFlash(); }
  }
  for(const f of G.flashes){
    f.t -= dt;
    if(f.t<=0){
      if(areaFree(f.x,f.y,null)){
        G.enemies.push(makeEnemy(f.item.type, f.x, f.y, f.item.bonus));
        f.done=true;
      } else f.t = 0.3;
    }
  }
  G.flashes = G.flashes.filter(f=>!f.done);
}

function dirToward(e, tx, ty){
  const dx = tx - (e.x+16), dy = ty - (e.y+16);
  if(Math.abs(dx)>Math.abs(dy)) return dx>0?'right':'left';
  return dy>0?'down':'up';
}
function canGo(t, dir){
  const d = DIRS[dir];
  return areaFree(t.x + d[0]*8, t.y + d[1]*8, t);
}
function updateEnemy(e,dt){
  if(e.spawnGuard>0) e.spawnGuard-=dt;
  if(G.freeze>0) return;
  e.flash>0 && (e.flash-=dt);
  const moved = tryMove(e,dt);
  e.moveT -= dt;
  if(!moved || e.moveT<=0){
    const r = Math.random();
    if(r<0.35 && canGo(e,e.dir)){ /* 保持直行 */ }
    else if(r<0.7){
      // 追玩家或压基地
      const p=G.player;
      const target = (p && p.alive && Math.random()<0.5)
        ? {x:p.x, y:p.y} : {x:EAGLE.c*CELL, y:EAGLE.r*CELL};
      const nd = dirToward(e,target.x,target.y);
      if(canGo(e,nd)) e.dir=nd; else e.dir=choice(['up','down','left','right'].filter(d=>canGo(e,d))||[e.dir]);
    } else {
      e.dir = choice(['up','down','left','right'].filter(d=>canGo(e,d))||[e.dir]);
    }
    e.moveT = rnd(0.6,2.4);
  }
  e.fireT -= dt;
  if(e.fireT<=0){
    e.fireT = rnd(0.5,1.6);
    // 与玩家/基地同排同列时提高开火率
    let aggro = 0.25;
    const p=G.player;
    const cx=e.x+16, cy=e.y+16;
    if(p && p.alive){
      const px=p.x+16, py=p.y+16;
      if((Math.abs(px-cx)<10 && ((py<cy)===(e.dir==='up'))) ||
         (Math.abs(py-cy)<10 && ((px<cx)===(e.dir==='left')))) aggro=0.65;
    }
    const bx=EAGLE.c*CELL+16, by=EAGLE.r*CELL+16;
    if(Math.abs(bx-cx)<10 || Math.abs(by-cy)<10) aggro=Math.max(aggro,0.5);
    if(Math.random()<aggro) fireBullet(e);
  }
}

/* ---------------- 道具 ---------------- */
const PU_KINDS = ['star','helmet','grenade','tank','timer','shovel'];
function spawnPowerUp(){
  for(let i=0;i<60;i++){
    const c=irnd(1,COLS-3), r=irnd(1,ROWS-5);
    let ok=true;
    for(let rr=r;rr<r+2 && ok;rr++) for(let cc=c;cc<c+2;cc++){
      if(G.terrain[idx(cc,rr)]!==T_EMPTY){ ok=false; break; }
    }
    if(ok){
      G.powerups.push({ kind:choice(PU_KINDS), x:c*CELL-4, y:r*CELL-4, t:0 });
      return;
    }
  }
}
function applyPowerUp(kind){
  const p=G.player;
  switch(kind){
    case 'star': p.weapon=Math.min(3,p.weapon+1); break;
    case 'helmet': p.shield=10; break;
    case 'grenade':
      for(const e of G.enemies){ if(e.alive){ e.alive=false; boom(e.x,e.y,false); } }
      break;
    case 'tank': G.lives++; Sfx.life(); break;
    case 'timer': G.freeze=8; break;
    case 'shovel': G.baseRingT=15; setBaseRing(T_STEEL); break;
  }
  G.score+=500; G.stageScore+=500;
  Sfx.pick();
}
function updatePowerUps(dt){
  const p=G.player;
  for(const u of G.powerups){
    u.t+=dt;
    if(p && p.alive){
      const b=tankBox(p);
      if(overlap(b.x,b.y,b.w,b.h,u.x,u.y,24,24)){
        u.done=true; applyPowerUp(u.kind);
        G.popups.push({x:u.x+12,y:u.y+4,val:500,t:0.9});
      }
    }
  }
  G.powerups = G.powerups.filter(u=>!u.done);
  if(G.baseRingT>0){
    G.baseRingT-=dt;
    if(G.baseRingT<=0) setBaseRing(T_BRICK);
  }
  if(G.freeze>0) G.freeze-=dt;
}

/* ---------------- 玩家更新 ---------------- */
function updatePlayer(dt){
  const p=G.player;
  if(!p.alive){
    if(G.respawnT>0){
      G.respawnT-=dt;
      if(G.respawnT<=0 && G.lives>=0){
        // 经典规则：阵亡后武器降回 1 级
        const np=makePlayer(); np.weapon=1; G.player=np;
      }
    }
    return;
  }
  if(p.fireCD>0) p.fireCD-=dt;
  if(p.shield>0) p.shield-=dt;
  if(input.up){ setDir(p,'up'); tryMove(p,dt); }
  else if(input.down){ setDir(p,'down'); tryMove(p,dt); }
  else if(input.left){ setDir(p,'left'); tryMove(p,dt); }
  else if(input.right){ setDir(p,'right'); tryMove(p,dt); }
  if(input.fire) fireBullet(p);
}

/* ---------------- 关卡流程 ---------------- */
function startStage(n){
  G.stage=n;
  buildTerrain();
  G.enemies=[]; G.bullets=[]; G.flashes=[]; G.explosions=[]; G.popups=[]; G.powerups=[];
  G.queue = buildQueue(n);
  G.spawnT=0.5; G.spawnIdx=0;
  G.maxOn = Math.min(4+Math.floor(n/3), 6);
  G.freeze=0; G.baseRingT=0;
  G.kills={basic:0,fast:0,power:0,armor:0};
  G.stageScore=0;
  G.eagleAlive=true;
  G.player = makePlayer();
  if(G.stage===1) G.player.weapon=1;
  G.lives = (n===1)?3:G.lives;
  G.state='intro'; G.introT=0;
  Sfx.stage();
}
function onConfirm(){ // Enter / 点击确认
  Sfx.init();
  if(G.state==='menu') startStage(1);
  else if(G.state==='tally') startStage(G.stage+1);
  else if(G.state==='over' && G.overT>2.5) toMenu();
}
function toMenu(){
  G.state='menu'; G.paused=false;
}
function togglePause(){
  if(G.state!=='play') return;
  G.paused=!G.paused; Sfx.pause();
}

// 画布点击 = 确认（菜单/结算/结束）
canvas.addEventListener('pointerdown', ()=>{ Sfx.init(); onConfirm(); });

/* ---------------- 绘制：地形 ---------------- */
function drawBrickCell(ctx,c,r){
  const m = G.bmask[idx(c,r)];
  const x=c*CELL, y=r*CELL;
  for(let q=0;q<4;q++){
    if(!(m&(1<<q))) continue;
    const qx=x+(q%2)*8, qy=y+(q>>1)*8;
    ctx.fillStyle='#c65a1a'; ctx.fillRect(qx,qy,8,8);
    ctx.fillStyle='#8a3810';
    ctx.fillRect(qx,qy+3,8,1); ctx.fillRect(qx,qy+7,8,1);
    ctx.fillStyle='#e88040';
    ctx.fillRect(qx,qy,8,1);
    // 竖缝错位
    ctx.fillStyle='#8a3810';
    ctx.fillRect(qx+((q%2)?2:6),qy,1,3);
    ctx.fillRect(qx+((q%2)?6:2),qy+4,1,3);
  }
}
function drawSteelCell(ctx,c,r){
  const x=c*CELL, y=r*CELL;
  ctx.fillStyle='#adadad'; ctx.fillRect(x,y,16,16);
  ctx.fillStyle='#e8e8e8'; ctx.fillRect(x,y,16,2); ctx.fillRect(x,y,2,16);
  ctx.fillStyle='#636363'; ctx.fillRect(x,y+14,16,2); ctx.fillRect(x+14,y,2,16);
  ctx.fillStyle='#8a8a8a'; ctx.fillRect(x+4,y+4,8,8);
}
function drawGrassCell(ctx,c,r){
  const x=c*CELL, y=r*CELL;
  ctx.fillStyle='#1a7a1a'; ctx.fillRect(x,y,16,16);
  // 确定性草叶花纹
  const h=(c*73856093 ^ r*19349663)>>>0;
  ctx.fillStyle='#0d4d0d';
  for(let i=0;i<5;i++){
    const gx=x+((h>>(i*5))&15)%15, gy=y+((h>>(i*4+3))&15)%15;
    ctx.fillRect(gx, gy, 2, 2);
  }
  ctx.fillStyle='#3aa53a';
  for(let i=0;i<3;i++){
    const gx=x+((h>>(i*7+20))&15)%15, gy=y+((h>>(i*3+8))&15)%15;
    ctx.fillRect(gx, gy, 2, 1);
  }
}
function drawTerrain(ctx){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const t=G.terrain[idx(c,r)];
    if(t===T_BRICK) drawBrickCell(ctx,c,r);
    else if(t===T_STEEL) drawSteelCell(ctx,c,r);
    else if(t===T_GRASS) drawGrassCell(ctx,c,r);
  }
  // 护墙铁锹到期闪烁
  if(G.baseRingT>0 && G.baseRingT<3){
    // 最后 3 秒闪烁：整帧切换
  }
}
function drawEagle(ctx){
  const x=EAGLE.c*CELL, y=EAGLE.r*CELL;
  if(G.eagleAlive){
    ctx.fillStyle='#7a7a7a'; ctx.fillRect(x+4,y+26,24,5);
    ctx.fillStyle='#c8c8c8';
    ctx.fillRect(x+6,y+14,20,5);      // 翅
    ctx.fillRect(x+12,y+9,8,15);      // 身
    ctx.fillRect(x+13,y+4,6,6);       // 头
    ctx.fillStyle='#e8e8e8'; ctx.fillRect(x+6,y+14,20,2);

  } else {
    ctx.fillStyle='#5a5a5a'; ctx.fillRect(x+14,y+4,3,24);
    ctx.fillStyle='#8a8a8a'; ctx.fillRect(x+17,y+4,10,6);
    ctx.fillStyle='#3a3a3a'; ctx.fillRect(x+4,y+24,24,6);
  }
}

/* ---------------- 绘制：坦克 / 子弹 / 特效 ---------------- */
function drawTank(ctx,t){
  const pal = t.kind==='player' ? PAL_PLAYER
    : (t.type==='armor' ? PAL_ENEMY.armor[Math.max(0,4-t.hp)] : PAL_ENEMY[t.type]);
  const cx=t.x+16, cy=t.y+16;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(DIR_ANGLE[t.dir]);
  // 履带
  ctx.fillStyle=pal.tread;
  ctx.fillRect(-16,-15,7,30); ctx.fillRect(9,-15,7,30);
  ctx.fillStyle=pal.treadLight;
  const ph=Math.floor(t.tread/4)%3;
  for(let i=-14+ph*2;i<15;i+=6){ ctx.fillRect(-16,i,7,2); ctx.fillRect(9,i,7,2); }
  // 车体
  ctx.fillStyle=pal.body; ctx.fillRect(-9,-13,18,26);
  ctx.fillStyle=pal.dark; ctx.fillRect(-9,-13,18,3); ctx.fillRect(-9,10,18,3);
  // 炮塔 + 炮管
  ctx.fillStyle=pal.body; ctx.beginPath(); ctx.arc(0,1,7,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=pal.dark; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=pal.dark; ctx.fillRect(-2,-16,4,16);
  // 奖励坦克红光闪烁
  if(t.kind==='enemy' && t.bonus && Math.sin(G.time*18)>0){
    ctx.globalAlpha=0.45; ctx.fillStyle='#e83030'; ctx.fillRect(-16,-16,32,32); ctx.globalAlpha=1;
  }
  ctx.restore();
  // 护盾
  if(t.kind==='player' && t.shield>0){
    const a = t.shield<2 ? (Math.sin(G.time*24)>0?0.9:0.3) : 0.9;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.strokeStyle='#7fdfff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,21, G.time*6, G.time*6+Math.PI*1.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,21, G.time*6+Math.PI, G.time*6+Math.PI*2.2); ctx.stroke();
    ctx.restore();
  }
}
function drawBullet(ctx,b){
  ctx.fillStyle='#ffffff';
  ctx.fillRect(b.x,b.y,4,4);
}
function drawFlash(ctx,f){
  const cx=f.x+16, cy=f.y+16;
  const s = 6 + Math.abs(Math.sin(f.t*10))*10;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(f.t*8);
  ctx.fillStyle = Math.sin(f.t*20)>0 ? '#ffffff' : '#e8d048';
  ctx.fillRect(-s,-2,s*2,4);
  ctx.fillRect(-2,-s,4,s*2);
  ctx.restore();
}
function drawExplosion(ctx,e){
  const p = e.tiny ? (1-e.t/0.12) : (1-e.t/(e.big?0.5:0.28));
  const cx=e.x+(e.tiny?4:16), cy=e.y+(e.tiny?4:16);
  ctx.save();
  if(e.tiny){
    ctx.globalAlpha=1-p;
    ctx.fillStyle='#ffffff';
    const r=2+p*4;
    ctx.fillRect(cx-r,cy-1,r*2,2); ctx.fillRect(cx-1,cy-r,2,r*2);
  } else {
    const r = (e.big?14:8) + p*(e.big?22:12);
    ctx.globalAlpha=1-p*0.6;
    ctx.fillStyle='#ff3000'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff9000'; ctx.beginPath(); ctx.arc(cx,cy,r*0.66,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffe890'; ctx.beginPath(); ctx.arc(cx,cy,r*0.33,0,Math.PI*2); ctx.fill();
    if(e.big){
      ctx.fillStyle='#ff3000';
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4 + p*2;
        ctx.fillRect(cx+Math.cos(a)*r*1.3-2, cy+Math.sin(a)*r*1.3-2, 4,4);
      }
    }
  }
  ctx.restore();
}
function drawPowerUp(ctx,u){
  if(Math.sin(u.t*10)<-0.2) return; // 闪烁
  const x=u.x,y=u.y;
  ctx.fillStyle='#8b1a1a'; ctx.fillRect(x,y,24,24);
  ctx.fillStyle = Math.sin(u.t*10)>0 ? '#ffffff' : '#e8c0c0';
  ctx.fillRect(x,y,24,2); ctx.fillRect(x,y+22,24,2); ctx.fillRect(x,y,2,24); ctx.fillRect(x+22,y,2,24);
  ctx.fillStyle='#ffffff';
  const cx=x+12, cy=y+12;
  switch(u.kind){
    case 'star':
      ctx.fillStyle='#ffe840';
      ctx.fillRect(cx-2,cy-8,4,16); ctx.fillRect(cx-8,cy-2,16,4);
      ctx.fillRect(cx-5,cy-5,10,10);
      break;
    case 'helmet':
      ctx.fillStyle='#e8e8e8';
      ctx.beginPath(); ctx.arc(cx,cy+2,7,Math.PI,0); ctx.fill();
      ctx.fillRect(cx-8,cy+2,16,3);
      break;
    case 'grenade':
      ctx.fillStyle='#c8c8c8';
      ctx.beginPath(); ctx.arc(cx,cy+2,6,0,Math.PI*2); ctx.fill();
      ctx.fillRect(cx-2,cy-8,4,4);
      break;
    case 'tank':
      ctx.fillStyle='#ffe840';
      ctx.fillRect(cx-7,cy-5,3,10); ctx.fillRect(cx+4,cy-5,3,10);
      ctx.fillRect(cx-4,cy-3,8,8); ctx.fillRect(cx-1,cy-7,2,5);
      break;
    case 'timer':
      ctx.strokeStyle='#e8e8e8'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy-5); ctx.moveTo(cx,cy); ctx.lineTo(cx+4,cy+2); ctx.stroke();
      break;
    case 'shovel':
      ctx.fillStyle='#c8a050'; ctx.fillRect(cx-1,cy-8,3,10);
      ctx.fillStyle='#c8c8c8'; ctx.fillRect(cx-4,cy+2,9,7);
      break;
  }
}

function drawIntro(ctx){
  const t=G.introT;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  let cover; // 灰幕高度比例
  if(t<0.35) cover = t/0.35;
  else if(t<1.3) cover = 1;
  else cover = Math.max(0, 1-(t-1.3)/0.35);
  const h = cover*VIEW_H/2;
  ctx.fillStyle='#636363';
  ctx.fillRect(0,0,VIEW_W,h);
  ctx.fillRect(0,VIEW_H-h,VIEW_W,h);
  if(cover>=1){
    ctx.fillStyle='#1a1a1a';
    ctx.font='bold 24px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('STAGE '+G.stage, VIEW_W/2, VIEW_H/2);
  }
}
function drawTally(ctx){
  drawPlayField(ctx);
  ctx.fillStyle='rgba(0,0,0,0.78)';
  ctx.fillRect(40,40,PLAY_W-80,PLAY_H-80);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#e8e8e8';
  ctx.font='bold 22px monospace';
  ctx.fillText('STAGE '+G.stage+' 通关', PLAY_W/2, 84);
  ctx.font='15px monospace';
  let y=130;
  const types=['basic','fast','power','armor'];
  for(const ty of types){
    const n=G.kills[ty];
    if(n>0){
      ctx.fillStyle='#c8c8c8';
      ctx.fillText(ENEMY_NAME[ty]+'  '+n+' x '+ENEMY_VAL[ty], PLAY_W/2, y);
      y+=26;
    }
  }
  ctx.fillStyle='#e8c53a';
  ctx.font='bold 17px monospace';
  ctx.fillText('本关得分 '+G.stageScore, PLAY_W/2, y+10);
  ctx.fillText('总分 '+G.score, PLAY_W/2, y+38);
  if(Math.sin(G.time*5)>-0.3){
    ctx.fillStyle='#e8e8e8';
    ctx.font='14px monospace';
    ctx.fillText(IS_TOUCH?'点击继续':'ENTER 进入下一关', PLAY_W/2, PLAY_H-70);
  }
}
function drawOver(ctx){
  drawPlayField(ctx);
  const t=G.overT;
  const y = Math.min(VIEW_H*0.55, VIEW_H+30 - t*160);
  ctx.fillStyle='#e83030';
  ctx.font='bold 34px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('GAME OVER', PLAY_W/2, y);
  if(t>2.5 && Math.sin(G.time*5)>-0.3){
    ctx.fillStyle='#e8e8e8';
    ctx.font='15px monospace';
    ctx.fillText(IS_TOUCH?'点击返回菜单':'ENTER 返回菜单', PLAY_W/2, y+50);
  }
}
function drawPlayField(ctx){
  // 底色
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,PLAY_W,PLAY_H);
  drawTerrain(ctx);
  drawEagle(ctx);
  for(const u of G.powerups) drawPowerUp(ctx,u);
  const p=G.player;
  if(p && p.alive) drawTank(ctx,p);
  for(const e of G.enemies) if(e.alive) drawTank(ctx,e);
  for(const b of G.bullets) drawBullet(ctx,b);
  // 草丛盖在坦克上（隐蔽效果）
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(G.terrain[idx(c,r)]===T_GRASS) drawGrassCell(ctx,c,r);
  }
  for(const f of G.flashes) drawFlash(ctx,f);
  for(const e of G.explosions){ e.t-=0; drawExplosion(ctx,e); }
  // 得分漂浮
  ctx.font='bold 12px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const s of G.popups){
    ctx.globalAlpha = clamp(s.t/0.4,0,1);
    ctx.fillStyle='#ffffff';
    ctx.fillText(String(s.val), s.x, s.y - (0.9-s.t)*22);
    ctx.globalAlpha=1;
  }
  // 冻结提示
  if(G.freeze>0 && Math.sin(G.time*8)>0){
    ctx.fillStyle='#7fdfff';
    ctx.font='bold 14px monospace';
    ctx.fillText('敌 冻 结', PLAY_W/2, 20);
  }
  drawSidebar(ctx);
  if(G.paused && Math.sin(G.time*6)>0){
    ctx.fillStyle='#e8e8e8';
    ctx.font='bold 26px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('PAUSE', PLAY_W/2, PLAY_H/2);
  }
}

/* ---------------- 主循环 ---------------- */
function update(dt){
  G.time += dt;
  if(G.state==='intro'){
    G.introT += dt;
    if(G.introT>=1.65) G.state='play';
    return;
  }
  if(G.state==='play'){
    if(G.paused) return;
    updatePlayer(dt);
    updateSpawner(dt);
    for(const e of G.enemies) if(e.alive) updateEnemy(e,dt);
    G.enemies = G.enemies.filter(e=>e.alive);
    updateBullets(dt);
    updatePowerUps(dt);
    for(const ex of G.explosions) ex.t-=dt;
    G.explosions = G.explosions.filter(e=>e.t>0);
    for(const s of G.popups) s.t-=dt;
    G.popups = G.popups.filter(s=>s.t>0);
    // 通关判定
    if(G.queue.length===0 && G.flashes.length===0 && G.enemies.length===0 && G.player && G.player.alive){
      G.clearT += dt;
      if(G.clearT>1.6){
        G.clearT=0;
        if(G.score>G.best){ G.best=G.score; localStorage.setItem('tank2_best',G.best); }
        G.state='tally'; G.tallyT=0;
      }
    } else G.clearT=0;
    return;
  }
  if(G.state==='tally'){
    G.tallyT+=dt;
    if(G.tallyT>5) startStage(G.stage+1);
    for(const ex of G.explosions) ex.t-=dt;
    G.explosions = G.explosions.filter(e=>e.t>0);
    return;
  }
  if(G.state==='over'){
    G.overT+=dt;
    for(const ex of G.explosions) ex.t-=dt;
    G.explosions = G.explosions.filter(e=>e.t>0);
    if(G.overT>6) toMenu();
    return;
  }
  // menu：仅动画
}

function render(){
  const ctx = CTX;
  ctx.save();
  if(G.state==='menu') drawMenu(ctx);
  else if(G.state==='intro') drawIntro(ctx);
  else if(G.state==='tally') drawTally(ctx);
  else if(G.state==='over') drawOver(ctx);
  else drawPlayField(ctx);
  ctx.restore();
}

let lastT = 0;
function loop(ts){
  const dt = Math.min(0.05,(ts-lastT)/1000||0.016);
  lastT = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------------- 画布自适应 ---------------- */
function resize(){
  const availW = window.innerWidth, availH = window.innerHeight;
  const scale = Math.min(availW/VIEW_W, availH/VIEW_H);
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.style.width = Math.floor(VIEW_W*scale)+'px';
  canvas.style.height = Math.floor(VIEW_H*scale)+'px';
  canvas.width = Math.floor(VIEW_W*scale*dpr);
  canvas.height = Math.floor(VIEW_H*scale*dpr);
  CTX.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  CTX.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
resize();

/* ---------------- 启动 ---------------- */
buildTerrain(); // 供菜单背景兜底
requestAnimationFrame(loop);
</script>
